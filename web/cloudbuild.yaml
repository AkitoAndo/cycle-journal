substitutions:
  _IMAGE: asia-northeast1-docker.pkg.dev/cycle-journal/cycle-web/web:latest
  _NEXT_PUBLIC_API_BASE_URL: ""
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - --tag
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}
